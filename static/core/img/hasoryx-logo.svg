<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
<title id="title">HASORYX International Logistics</title>
<desc id="desc">Original geometric H monogram wrapped by a global route orbit, followed by the Hasoryx wordmark.</desc>
<defs>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb347"/>
    <stop offset="1" stop-color="#f36b21"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dce5ef"/>
  </linearGradient>
</defs>
<!-- Global route orbit -->
<circle cx="108" cy="103" r="78" fill="none" stroke="#60758e" stroke-width="2.5" opacity=".8"/>
<path d="M40 66 C68 24 132 9 177 47" fill="none" stroke="#60758e" stroke-width="2" opacity=".75"/>
<path d="M37 137 C74 183 144 185 179 142" fill="none" stroke="#60758e" stroke-width="2" opacity=".75"/>
<path d="M108 25 C78 57 78 146 108 181 M108 25 C139 58 139 147 108 181" fill="none" stroke="#60758e" stroke-width="1.8" opacity=".6"/>
<path d="M32 103 H184" fill="none" stroke="#60758e" stroke-width="1.8" opacity=".55"/>
<!-- H monogram -->
<path d="M65 55 H91 V91 H126 V55 H152 V151 H126 V115 H91 V151 H65 Z" fill="url(#metal)"/>
<!-- Forward route sweep -->
<path d="M22 128 C67 151 115 151 165 119 C181 109 194 97 207 83 C185 130 147 160 99 166 C66 170 39 155 22 128Z" fill="url(#route)"/>
<path d="M31 126 C76 146 126 137 170 104" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
<circle cx="174" cy="100" r="5" fill="#fff"/>
<!-- Wordmark -->
<text x="226" y="119" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="1.5">HASORY<tspan fill="#f58232">X</tspan></text>
<path d="M229 143 H680" stroke="#f58232" stroke-width="3"/>
<text x="231" y="177" fill="#e5eaf0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4.1">INTERNATIONAL LOGISTICS</text>
<text x="231" y="202" fill="#9eafc2" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.6">GLOBAL REACH  •  TRUSTED DELIVERY</text>
</svg>