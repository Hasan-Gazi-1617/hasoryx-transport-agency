<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
<title id="title">HASORYX Transport Agency Limited</title>
<desc id="desc">Distinctive H monogram with a forward-moving road and cargo truck motif, followed by the Hasoryx Transport Agency wordmark.</desc>
<defs>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f36b21"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dce5ef"/></linearGradient>
</defs>
<!-- Distinctive H and road mark -->
<path d="M56 49 H82 V88 H122 V49 H148 V151 H122 V113 H82 V151 H56 Z" fill="url(#silver)"/>
<path d="M26 137 C60 158 111 159 153 132 C172 120 188 103 202 82 C184 129 147 160 100 168 C67 173 41 158 26 137Z" fill="url(#orange)"/>
<path d="M37 132 C76 149 125 140 169 108" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<!-- Cargo truck silhouette -->
<g transform="translate(122 22)" stroke="#f58232" stroke-width="2.8" stroke-linejoin="round">
 <path d="M4 37 H42 V61 H4 Z" fill="#fff"/>
 <path d="M42 45 H58 L70 57 V61 H42 Z" fill="#dce5ef"/>
 <path d="M49 48 H57 L64 56 H49 Z" fill="#26384d" stroke="none"/>
 <circle cx="17" cy="64" r="6" fill="#172a43" stroke="#fff" stroke-width="2"/>
 <circle cx="55" cy="64" r="6" fill="#172a43" stroke="#fff" stroke-width="2"/>
</g>
<!-- Wordmark -->
<text x="226" y="119" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="1.5">HASORY<tspan fill="#f58232">X</tspan></text>
<path d="M229 143 H680" stroke="#f58232" stroke-width="3"/>
<text x="231" y="179" fill="#e5eaf0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4">TRANSPORT AGENCY LIMITED</text>
<text x="231" y="204" fill="#9eafc2" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.6">MOVING BUSINESS FORWARD</text>
</svg>